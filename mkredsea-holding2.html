<style>
  :root{
    --abyss-top:#0d3244;
    --abyss-bottom:#062033;
    --sand:#f3ecdc;
    --sand-dim:#c9c3b3;
    --teal:#1fa8c4;
    --coral:#e4573f;
    --logo-red:#d21b16;
    --coral-purple:#8c1c6b;
    --coral-pink:#e83454;
    --gold:#f08113;
    --line:rgba(243,236,220,0.18);
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    background:var(--abyss-bottom);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    font-family:'Manrope',sans-serif;
    color:var(--sand);
    min-height:100%;
    display:flex;
    flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    overflow-x:hidden;
    position:relative;
    background:
      radial-gradient(ellipse 120% 60% at 50% 0%, #163f55 0%, var(--abyss-top) 45%, var(--abyss-bottom) 100%);
  }

  /* light-ray + caustic shimmer, single ambient motion */
  .rays{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    opacity:0.5;
    background:
      linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.05) 38%, transparent 46%),
      linear-gradient(100deg, transparent 55%, rgba(255,255,255,0.04) 62%, transparent 70%);
    background-size:200% 200%;
    animation:driftRays 22s ease-in-out infinite alternate;
  }
  @keyframes driftRays{
    0%{background-position:0% 0%;}
    100%{background-position:15% 8%;}
  }

  .bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .bubble{
    position:absolute;
    bottom:-40px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,0.55), rgba(255,255,255,0.05) 70%);
    animation-name:rise;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
  }
  @keyframes rise{
    0%{transform:translateY(0) translateX(0);opacity:0;}
    8%{opacity:0.6;}
    100%{transform:translateY(-115vh) translateX(var(--drift,20px));opacity:0;}
  }

  /* coral clusters, built from the logo's own branch shapes + colours,
     anchored to the corners so the page reads as this brand's, not a generic wave scene */
  .coral-field{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .coral{
    position:absolute;
    filter:drop-shadow(0 12px 24px rgba(0,0,0,0.35));
  }
  .coral--left{left:-3.5rem;bottom:-2rem;width:min(230px, 34vw);
    -webkit-mask-image:linear-gradient(to top, black 55%, transparent 96%);
    mask-image:linear-gradient(to top, black 55%, transparent 96%);
  }
  .coral--right{right:-4.5rem;bottom:-3rem;width:min(190px, 30vw);
    -webkit-mask-image:linear-gradient(to top, black 45%, transparent 92%);
    mask-image:linear-gradient(to top, black 45%, transparent 92%);
  }
  .dot-scatter circle{opacity:0.85;}

  main{
    position:relative;
    z-index:1;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:7vh 1.75rem 5vh;
  }

  .mast{
    display:flex;
    align-items:center;
    gap:0.85rem;
    margin-bottom:2rem;
  }
  .logo{
    width:min(96px, 22vw);
    height:auto;
    filter:drop-shadow(0 8px 18px rgba(0,0,0,0.35));
  }
  .eyebrow{
    font-family:'Manrope',sans-serif;
    font-size:1.05rem;
    letter-spacing:0.01em;
    color:var(--sand-dim);
    margin:0;
    font-weight:700;
    text-align:left;
  }
  .eyebrow .red-accent{
    color:var(--logo-red);
  }

  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:clamp(2.2rem, 6vw, 4rem);
    line-height:1.1;
    max-width:17ch;
    margin:0 0 1.3rem;
    letter-spacing:-0.015em;
  }
  h1 .wiggle{
    position:relative;
    display:inline-block;
    color:var(--coral-pink);
    font-style:italic;
  }
  h1 .wiggle svg{
    position:absolute;
    left:-2%;
    bottom:-0.24em;
    width:104%;
    height:0.3em;
    overflow:visible;
  }

  p.lead{
    font-size:clamp(1.02rem, 1.7vw, 1.18rem);
    line-height:1.65;
    color:var(--sand-dim);
    max-width:36ch;
    margin:0 0 2.8rem;
  }

  form{
    display:flex;
    align-items:flex-end;
    width:100%;
    max-width:400px;
    gap:1rem;
    margin-bottom:1.1rem;
  }
  .field{
    flex:1;
    min-width:0;
    text-align:left;
  }
  input[type="email"]{
    width:100%;
    padding:0.55rem 0.15rem 0.7rem;
    border:none;
    border-bottom:1.5px solid var(--line);
    background:transparent;
    color:var(--sand);
    font-family:'Manrope',sans-serif;
    font-size:1rem;
    outline:none;
    border-radius:0;
    transition:border-color 0.2s ease;
  }
  input[type="email"]::placeholder{color:var(--sand-dim);opacity:0.7;}
  input[type="email"]:focus{border-color:var(--teal);}
  input[type="email"]:focus-visible{outline:none;border-color:var(--teal);}

  button{
    position:relative;
    padding:0.8rem 1.7rem 0.8rem 1.4rem;
    border:none;
    background:var(--logo-red);
    color:var(--sand);
    font-family:'Manrope',sans-serif;
    font-weight:600;
    font-size:0.95rem;
    cursor:pointer;
    white-space:nowrap;
    clip-path:polygon(0 0, 88% 0, 100% 50%, 88% 100%, 0 100%);
    transition:background 0.2s ease, transform 0.15s ease;
  }
  button:hover{background:var(--coral-pink);transform:translateX(2px);}
  button:active{transform:translateX(0) scale(0.98);}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}

  .status{
    min-height:1.4em;
    font-size:0.9rem;
    color:var(--teal);
    margin-bottom:1.8rem;
    text-align:left;
    width:100%;
    max-width:400px;
  }

  .contact{
    font-size:0.9rem;
    color:var(--sand-dim);
  }
  .contact a{
    color:var(--sand);
    text-decoration:none;
    border-bottom:1px solid var(--line);
    padding-bottom:1px;
    transition:border-color 0.2s ease, color 0.2s ease;
  }
  .contact a:hover{border-color:var(--teal);color:var(--teal);}

  footer{
    position:relative;
    z-index:1;
    text-align:center;
    font-size:0.78rem;
    color:var(--sand-dim);
    padding:1.4rem 1rem calc(1.4rem + env(safe-area-inset-bottom,0px));
    opacity:0.7;
  }

  @media (min-width:640px){
    main{align-items:flex-start;text-align:left;padding-left:max(9vw, 3rem);}
    p.lead{margin-left:0;}
    form, .status{margin-left:0;}
  }

  @media (max-width:480px){
    form{flex-direction:column;align-items:stretch;gap:1.3rem;}
    button{align-self:flex-start;}
  }

  @media (prefers-reduced-motion:reduce){
    .rays, .bubble{animation:none;}
  }
</style>
</head>

      <circle cx="150" cy="70" r="9" fill="var(--gold)"/>

    <svg class="coral coral--right" viewBox="0 0 170 260" xmlns="http://www.w3.org/2000/svg">
      <path transform="translate(50,0) rotate(7)" fill="var(--coral-pink)" d="M26 240 C13 229 10 203 21 188 C9 178 6 151 20 137 C8 128 10 100 26 88 C39 96 42 120 31 132 C45 143 44 170 32 183 C44 194 40 222 25 240 Z"/>
      <path transform="translate(-8,40) rotate(-8)" fill="var(--coral-purple)" opacity="0.9" d="M22 200 C11 191 9 170 18 157 C8 149 6 126 18 114 C29 121 31 141 22 150 C33 159 32 182 21 195 Z"/>

  <div class="bubbles" aria-hidden="true" id="bubbleField"></div>

    <h1>The reef is still<br><span class="wiggle">quiet<svg viewBox="0 0 200 20" preserveAspectRatio="none"><path d="M2 12 Q 20 2, 38 12 T 74 12 T 110 12 T 146 12 T 182 12" fill="none" stroke="var(--teal)" stroke-width="4" stroke-linecap="round"/></svg></span> — for now.</h1>

    <p class="lead">We're charting a new site for MK Red Sea. Dive itineraries, reef life and Red Sea adventures are on their way. Leave your email and be the first to know when we surface.</p>

    <form id="notifyForm" novalidate>
      <div class="field">
        <label for="email" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <button type="submit">Notify me</button>
    </form>
    <p class="status" id="formStatus" role="status" aria-live="polite"></p>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  // Ambient rising bubbles — decorative only
  const field = document.getElementById('bubbleField');
  const count = window.innerWidth < 600 ? 10 : 18;
  for (let i = 0; i < count; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 4 + Math.random() * 14;
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.left = Math.random() * 100 + '%';
    b.style.setProperty('--drift', (Math.random() * 60 - 30) + 'px');
    const duration = 10 + Math.random() * 14;
    b.style.animationDuration = duration + 's';
    b.style.animationDelay = (Math.random() * duration) + 's';
    field.appendChild(b);
  }

  // Notify form — front-end only confirmation (no backend wired up yet)
  const form = document.getElementById('notifyForm');
  const status = document.getElementById('formStatus');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    if(!valid){
      status.textContent = 'Please enter a valid email address.';
      status.style.color = '#d21b16';
      return;
    }
    status.textContent = "Thanks — we'll let you know when we launch.";
    status.style.color = '#1fa8c4';
    form.reset();
  });
</script>
